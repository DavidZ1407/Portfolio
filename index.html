<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Zahn | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aboutMe.css">
    <script defer src="constants.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <header class="header">
        <a href="#home" class="logo">David <span>Zahn</span></a>
        <nav class="navbar">
            <a href="#home">Home</a>
            <a href="#work">Work</a>
            <a href="#about">Timeline</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="home" id="home">
            <div class="home_content">
                <h3>Developer & Designer</h3>
                <h1>HELLO WORLD.</h1>
                <p>Willkommen auf meiner Expedition.</p>
            </div>
        </section>

        <section class="work" id="work">
            <h1 class="heading">Selected Projects</h1>
            <div id="project-grid" class="container_work"></div>
        </section>

        <section class="about_me" id="about">
            <h1 class="heading">Timeline</h1>
            <div class="water_timeline">
                <svg class="map-path-svg" viewBox="0 0 100 800" preserveAspectRatio="none">
                    <path d="M50,0 Q80,100 50,200 T50,400 T50,600 T50,800" 
                          fill="none" stroke="#e63946" stroke-width="1.5" stroke-dasharray="4,4" />
                </svg>
                <div id="timeline-list"></div>
            </div>
        </section>

        <section class="contact" id="contact">
            <h1 class="heading">Get in Touch</h1>
            <div class="contact_links">
                <a href="mailto:deinemail@beispiel.de">Email</a>
            </div>
        </section>
    </main>
</body>
</html>
