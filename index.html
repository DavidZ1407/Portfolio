<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Zahn | Portfolio</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aboutMe.css">
    <link rel="stylesheet" href="contact.css">
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script defer src="constants.js"></script>
    <script defer src="script.js"></script>
</head>
<body>

    <header class="header">
        <a href="#" class="logo">DAVID <span>ZAHN</span></a>

            <a href="#home">Home</a>
            <a href="#work">Projects</a>
            <a href="#about">Expedition</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="home" id="home">
        <div class="home_content">
            <h3>Developer & Designer</h3>
            <h1>HELLO WORLD.</h1>
        </div>
    </section>

    <section class="work" id="work">
        <h1 class="section_title">Selected Projects</h1>
        <div id="project-grid" class="container_work"></div>
    </section>

    <section class="about_me" id="about">
        <h1 class="section_title" style="text-align: center; border: none;">Education</h1>
        <div class="water_timeline">
            <svg class="map-path-svg" viewBox="0 0 100 800" preserveAspectRatio="none">
                <path d="M50,0 Q80,100 20,200 T50,400 T80,600 T50,800" 
                      fill="none" stroke="#e63946" stroke-width="2" stroke-dasharray="5,5" />
            </svg>
            <div id="timeline-list"></div>
        </div>
    </section>

    <section class="contact" id="contact">
        <div class="contact_content">
            <h1>Contact</h1>
            <div class="icons">
                </div>
        </div>
